version: '3.8'

services:
  # Backend FastAPI with Oracle connection
  debt-dashboard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debt-dashboard-backend
    ports:
      - "3898:8001"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SERVICE_NAME=${DB_SERVICE_NAME}
    restart: always

  # Frontend Nginx with built React app
  debt-dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: debt-dashboard-frontend
    ports:
      - "3008:80"
    depends_on:
      - debt-dashboard-backend
    restart: always
